<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Prototipo - Stick Fight con Fluidos</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background-color: #1a1a24;
                font-family: "Segoe UI", sans-serif;
                color: #eee;
            }
            canvas {
                display: block;
            }
            #panel {
                position: absolute;
                top: 15px;
                left: 15px;
                background: rgba(15, 15, 20, 0.85);
                padding: 15px 20px;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                pointer-events: none;
                z-index: 10;
            }
            h3 {
                margin: 0 0 8px 0;
                color: #44aaff;
                font-size: 18px;
            }
            p {
                margin: 4px 0;
                font-size: 14px;
                color: #ccc;
            }
            .highlight {
                color: #ff9933;
                font-weight: bold;
            }
        </style>
        <script src="https://google.github.io/liquidfun/testbed/liquidfun.js"></script>
        <script src="js/ActiveRagdoll.js"></script>
    </head>
    <body>
        <div id="panel">
            <h3>Armas de Fluidos</h3>
            <p>
                Presiona <span class="highlight">1</span>: Ácido (Verde, rápido)
            </p>
            <p>
                Presiona <span class="highlight">2</span>: Lava (Naranja,
                tensión)
            </p>
            <p>
                Presiona <span class="highlight">3</span>: Miel (Amarillo,
                viscoso)
            </p>
            <p><br />Click para disparar hacia el mouse.</p>
        </div>
        <canvas id="canvas"></canvas>

        <script>
            window.onload = function () {
                const canvas = document.getElementById("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const SCALE = 40;
                const toMeters = (px) => px / SCALE;
                const toPixels = (m) => m * SCALE;

                window.world = new b2World(new b2Vec2(0, 10));

                // Escenario
                const groundBody = window.world.CreateBody(new b2BodyDef());
                const escenarioVisual = [];

                function crearLineaEstica(x1, y1, x2, y2) {
                    const edge = new b2EdgeShape();
                    edge.Set(
                        new b2Vec2(toMeters(x1), toMeters(y1)),
                        new b2Vec2(toMeters(x2), toMeters(y2)),
                    );
                    groundBody.CreateFixtureFromShape(edge, 0);
                    escenarioVisual.push({ x1, y1, x2, y2 });
                }

                const w = canvas.width;
                const h = canvas.height;

                // Suelo y paredes
                crearLineaEstica(0, h * 0.8, w, h * 0.8);
                crearLineaEstica(0, 0, 0, h);
                crearLineaEstica(w, 0, w, h);

                // Ragdoll Activo
                const dynamicBodies = [];
                const myRagdoll = new ActiveRagdoll(
                    window.world,
                    w * 0.5,
                    h * 0.5,
                    dynamicBodies,
                );

                // Sistema de Partículas
                const psDef = new b2ParticleSystemDef();
                psDef.radius = toMeters(6);
                psDef.dampingStrength = 0.2;
                const particleSystem = window.world.CreateParticleSystem(psDef);

                // NUEVO: Herramienta (Goma de borrar) de partículas para esquivar la limitación de JS
                const eraserShape = new b2CircleShape();
                eraserShape.radius = toMeters(1); // Círculo muy chiquito
                const eraserTransform = new b2Transform();
                eraserTransform.SetIdentity();

                // Controles de Armas y Movimiento
                let armaActual = 1;
                const teclasPulsadas = {}; // NUEVO: Diccionario para guardar qué teclas están apretadas

                window.addEventListener("keydown", (e) => {
                    const key = e.key.toLowerCase();
                    teclasPulsadas[key] = true; // Guardamos que se apretó

                    if (key === "1") {
                        armaActual = 1;
                        console.log("Arma: Ácido");
                    }
                    if (key === "2") {
                        armaActual = 2;
                        console.log("Arma: Lava");
                    }
                    if (key === "3") {
                        armaActual = 3;
                        console.log("Arma: Miel");
                    }
                });

                // NUEVO: Cuando se suelta la tecla, la borramos del registro
                window.addEventListener("keyup", (e) => {
                    teclasPulsadas[e.key.toLowerCase()] = false;
                });

                window.addEventListener("mousedown", (e) => {
                    if (!myRagdoll) return;

                    const torsoPos = myRagdoll.torso.GetPosition();
                    const mouseX = toMeters(e.clientX);
                    const mouseY = toMeters(e.clientY);

                    const dirX = mouseX - torsoPos.x;
                    const dirY = mouseY - torsoPos.y;
                    const length = Math.sqrt(dirX * dirX + dirY * dirY);

                    const fuerzaDisparo = 20;

                    const pgDef = new b2ParticleGroupDef();
                    const shape = new b2CircleShape();
                    shape.position.Set(
                        torsoPos.x + (dirX / length) * 1.5,
                        torsoPos.y + (dirY / length) * 1.5,
                    );
                    shape.radius = toMeters(15);
                    pgDef.shape = shape;

                    pgDef.linearVelocity = new b2Vec2(
                        (dirX / length) * fuerzaDisparo,
                        (dirY / length) * fuerzaDisparo,
                    );

                    if (armaActual === 1) {
                        pgDef.flags = b2_waterParticle;
                        pgDef.color = new b2ParticleColor(50, 255, 50, 255);
                    } else if (armaActual === 2) {
                        pgDef.flags = b2_tensileParticle;
                        pgDef.color = new b2ParticleColor(255, 80, 20, 255);
                    } else if (armaActual === 3) {
                        pgDef.flags = b2_viscousParticle;
                        pgDef.color = new b2ParticleColor(255, 200, 50, 255);
                    }

                    particleSystem.CreateParticleGroup(pgDef);
                });

                // Loop
                function loop() {
                    if (myRagdoll) {
                        // Comprobación de seguridad
                        myRagdoll.updateMuscles();
                        myRagdoll.move(teclasPulsadas); // NUEVO: Procesar movimiento horizontal
                    }

                    window.world.Step(1 / 60, 8, 3, 3);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Escenario
                    ctx.strokeStyle = "#444";
                    ctx.lineWidth = 6;
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    for (let linea of escenarioVisual) {
                        ctx.moveTo(linea.x1, linea.y1);
                        ctx.lineTo(linea.x2, linea.y2);
                    }
                    ctx.stroke();

                    // Partículas (Renderizado, Colisiones y Limpieza)
                    const pCount = particleSystem.GetParticleCount();
                    const posBuffer = particleSystem.GetPositionBuffer();
                    const colorBuffer = particleSystem.GetColorBuffer();

                    const torsoPos = myRagdoll.torso.GetPosition();
                    const torsoPixelX = toPixels(torsoPos.x);
                    const torsoPixelY = toPixels(torsoPos.y);

                    for (let i = pCount - 1; i >= 0; i--) {
                        const px = toPixels(posBuffer[i * 2]);
                        const py = toPixels(posBuffer[i * 2 + 1]);

                        // 1. Limpieza: Si la partícula cae fuera de la pantalla
                        if (py > canvas.height) {
                            eraserShape.position.Set(
                                posBuffer[i * 2],
                                posBuffer[i * 2 + 1],
                            );
                            particleSystem.DestroyParticlesInShape(
                                eraserShape,
                                eraserTransform,
                            );
                            continue;
                        }

                        const r = colorBuffer[i * 4];
                        const g = colorBuffer[i * 4 + 1];
                        const b = colorBuffer[i * 4 + 2];

                        // 2. Colisión: Detectar si toca el torso
                        const dist = Math.hypot(
                            px - torsoPixelX,
                            py - torsoPixelY,
                        );
                        if (dist < 25) {
                            if (g === 255 && r === 50) {
                                // ÁCIDO
                                myRagdoll.takeDamage(2);
                                eraserShape.position.Set(
                                    posBuffer[i * 2],
                                    posBuffer[i * 2 + 1],
                                );
                                particleSystem.DestroyParticlesInShape(
                                    eraserShape,
                                    eraserTransform,
                                );
                                continue;
                            } else if (r === 255 && g === 80) {
                                // LAVA
                                myRagdoll.takeDamage(0.1);
                            } else if (r === 255 && g === 200) {
                                // MIEL
                                myRagdoll.applyHoney();
                                eraserShape.position.Set(
                                    posBuffer[i * 2],
                                    posBuffer[i * 2 + 1],
                                );
                                particleSystem.DestroyParticlesInShape(
                                    eraserShape,
                                    eraserTransform,
                                );
                                continue;
                            }
                        }

                        // 3. Renderizado
                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        ctx.beginPath();
                        ctx.arc(px, py, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // UI: Dibujar la barra de vida en pantalla
                    ctx.fillStyle = myRagdoll.hp > 30 ? "#55ff55" : "#ff5555";
                    ctx.font = "bold 24px Segoe UI";
                    ctx.fillText(
                        `Salud: ${Math.floor(myRagdoll.hp)}%`,
                        20,
                        canvas.height - 30,
                    );

                    // Ragdoll
                    ctx.fillStyle = "#ff9933";
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;

                    for (let item of dynamicBodies) {
                        const pos = item.body.GetPosition();
                        const angle = item.body.GetAngle();

                        ctx.save();
                        ctx.translate(toPixels(pos.x), toPixels(pos.y));
                        ctx.rotate(angle);

                        ctx.beginPath();
                        if (item.type === "box") {
                            ctx.rect(
                                -item.width,
                                -item.height,
                                item.width * 2,
                                item.height * 2,
                            );
                        } else if (item.type === "circle") {
                            ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                        }
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();
                    }
                    requestAnimationFrame(loop);
                }
                loop();
            };
        </script>
    </body>
</html>
